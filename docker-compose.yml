version: '3.8'

# Red Rabbit Orders Microservice - Development Environment
# Complete local development stack with all dependencies

services:
  # ===========================
  # Main Application Service
  # ===========================
  orders-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: redrabbit-orders-dev
    ports:
      - "3000:3000"
      - "9229:9229"  # Debug port
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      
      # Database Configuration (Constitution compliant)
      DATABASE_URL: postgres://postgres:postgres_dev_password@postgres:5432/redrabbit_orders_dev
      
      # Authentication (Development - Constitution compliant)
      JWT_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA4f5wg5l2hKsTeNem/V41fGnJm6gOdrj8ym3rFkEjWT2btf+FyQhHdFPc9NCtmFgYnpAGVJ8L7K7KYW+Xu5w7TvVKx1v9JhTjP7QvJ0QZH6q7JCkpkQ7q8i4P5g5w5l2hKsTeNem/V41fGnJm6gOdrj8ym3rFkEjWT2btf+FyQhHdFPc
        -----END PUBLIC KEY-----
      API_KEY_SALT: dev-api-key-salt-16-chars
      
      # Webhook Configuration (Constitution compliant)
      WEBHOOK_SIGNATURE_SECRET: development-webhook-signature-secret-minimum-32-characters-long
      
      # Feature Flags (Development)
      ENABLE_WEBHOOKS: true
      ENABLE_EMAIL_NOTIFICATIONS: false
      ENABLE_INVENTORY_RESERVATIONS: true
      MOCK_PAYMENT_PROCESSOR: true
      SEED_DATA: true
      DEBUG_SQL: true
      
      # Development Options
      REQUEST_LOGGING: true
      METRICS_ENABLED: true
    volumes:
      - .:/app
      - /app/node_modules
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - redrabbit-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================
  # PostgreSQL Database
  # ===========================
  postgres:
    image: postgres:15-alpine
    container_name: redrabbit-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: redrabbit_orders_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/migrations:/docker-entrypoint-initdb.d/
    networks:
      - redrabbit-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d redrabbit_orders_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================
  # Redis Cache (Optional)
  # ===========================
  redis:
    image: redis:7-alpine
    container_name: redrabbit-redis-dev
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - redrabbit-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================
  # Adminer - Database Management UI
  # ===========================
  adminer:
    image: adminer:latest
    container_name: redrabbit-adminer-dev
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - redrabbit-network
    restart: unless-stopped

  # ===========================
  # Mailhog - Email Testing (Optional)
  # ===========================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: redrabbit-mailhog-dev
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - redrabbit-network
    restart: unless-stopped

# ===========================
# Production Configuration
# ===========================
  # Production service (commented out for development)
  # Uncomment and modify for production deployment
  # orders-api-prod:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     target: production
  #   container_name: redrabbit-orders-prod
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     NODE_ENV: production
  #     LOG_LEVEL: warn
  #     # Use environment variables or secrets management
  #     # DB_HOST: ${DB_HOST}
  #     # JWT_SECRET: ${JWT_SECRET}
  #   depends_on:
  #     - postgres
  #   networks:
  #     - redrabbit-network
  #   restart: always

# ===========================
# Networks
# ===========================
networks:
  redrabbit-network:
    driver: bridge
    name: redrabbit-dev-network

# ===========================
# Volumes
# ===========================
volumes:
  postgres_data:
    name: redrabbit-postgres-dev-data
  redis_data:
    name: redrabbit-redis-dev-data
  logs:
    name: redrabbit-logs-dev-data