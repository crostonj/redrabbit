apiVersion: v1
kind: Secret
metadata:
  name: orders-api-secrets
  labels:
    app: orders-api
type: Opaque
stringData:
  DATABASE_URL: postgres://user:pass@postgres-host:5432/orders
  JWT_JWKS_URL: https://auth.example.com/.well-known/jwks.json
  WEBHOOK_SIGNATURE_SECRET: replace-with-strong-random-value
